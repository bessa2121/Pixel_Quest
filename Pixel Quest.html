<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sf)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--sf);border-bottom:3px solid var(--tx)}
.logo{font-weight:900;letter-spacing:1px;font-size:17px}.logo b{background:var(--ac);color:#fff;padding:2px 6px;margin-right:6px;box-shadow:2px 2px 0 var(--tx)}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}.chip{margin-left:auto;font-weight:700}
button{font:inherit;cursor:pointer;border:2px solid var(--tx);background:var(--sf);color:var(--tx);padding:6px 12px;border-radius:3px;box-shadow:2px 2px 0 var(--tx)}
button:active{transform:translate(2px,2px);box-shadow:none}button:disabled{opacity:.45;cursor:default}
nav button.on,.pri{background:var(--ac);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:1px;color:var(--mu)}
.card{background:var(--sf);border:2px solid var(--tx);border-radius:4px;padding:14px;margin-bottom:12px;box-shadow:4px 4px 0 var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.grid .card{margin:0}
.stat b{display:block;font-size:22px}.mu{color:var(--mu);font-size:13px}
.bar{height:12px;background:var(--bd);border:2px solid var(--tx);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:6px 0}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.hero canvas{width:96px;height:128px;background:#2f6b3a;border:3px solid var(--tx);image-rendering:pixelated}.hero>div{flex:1;min-width:200px}
.q{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd)}.q:last-child{border:0}
.q .ck{width:22px;height:22px;border:2px solid var(--tx);display:grid;place-items:center;flex:none}
.q.d .ck{background:var(--ok);color:#fff}.q.d .t{text-decoration:line-through;color:var(--mu)}.q .t{flex:1}
.mc{width:100%;height:auto;display:block;image-rendering:pixelated;border:3px solid var(--tx);cursor:pointer;aspect-ratio:2/1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button.on{background:var(--gd);color:#000}
.stage{position:relative}
#cv{width:100%;height:auto;display:block;border:3px solid var(--tx);image-rendering:pixelated;touch-action:none;background:#000}
#ov{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:rgba(10,8,25,.8);color:#fff}
#ov.on{display:grid}#ov div{padding:16px}#ov button{margin:4px;color:var(--tx)}#ov .pri{color:#fff}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:12px;user-select:none;-webkit-user-select:none}
.pad button{width:52px;height:52px;padding:0;font-size:20px;touch-action:none}
.dp{display:grid;grid-template-columns:repeat(3,52px);gap:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 14px;border:2px solid #000;display:none;z-index:20;max-width:90vw}
.v{display:none}.v.on{display:block}input[type=color]{width:56px;height:34px;border:2px solid var(--tx);padding:0;background:none;cursor:pointer}
